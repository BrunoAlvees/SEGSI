<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="aR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b03a2e"/>
    </marker>
    <marker id="aB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f618d"/>
    </marker>
  </defs>

  <!-- ===== CLIENTE (PC) ===== -->
  <g>
    <!-- ecra -->
    <rect x="70" y="80" width="150" height="100" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2.5"/>
    <rect x="82" y="92" width="126" height="76" rx="2" fill="#f4f6f7" stroke="#34495e" stroke-width="1.2"/>
    <!-- base -->
    <rect x="132" y="180" width="26" height="16" fill="#34495e"/>
    <rect x="108" y="196" width="74" height="7" rx="3" fill="#34495e"/>
    <!-- detalhe simples no ecra -->
    <line x1="96" y1="110" x2="194" y2="110" stroke="#aeb6bf" stroke-width="2"/>
    <line x1="96" y1="124" x2="178" y2="124" stroke="#aeb6bf" stroke-width="2"/>
    <line x1="96" y1="138" x2="186" y2="138" stroke="#aeb6bf" stroke-width="2"/>
    <line x1="96" y1="152" x2="160" y2="152" stroke="#aeb6bf" stroke-width="2"/>

    <text x="145" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Cliente</text>
    <text x="145" y="252" text-anchor="middle" font-size="14" fill="#1f618d" font-weight="600">192.168.170.130</text>
    <text x="145" y="270" text-anchor="middle" font-size="11" fill="#616a6b">MAC 00:0c:29:15:14:76 (VMware)</text>
  </g>

  <!-- ===== SERVIDOR (DC/AD) ===== -->
  <g>
    <rect x="640" y="76" width="150" height="120" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2.5"/>
    <rect x="654" y="90" width="122" height="26" rx="3" fill="#f4f6f7" stroke="#34495e" stroke-width="1.2"/>
    <rect x="654" y="122" width="122" height="26" rx="3" fill="#f4f6f7" stroke="#34495e" stroke-width="1.2"/>
    <rect x="654" y="154" width="122" height="26" rx="3" fill="#f4f6f7" stroke="#34495e" stroke-width="1.2"/>
    <circle cx="666" cy="103" r="3.2" fill="#27ae60"/>
    <circle cx="666" cy="135" r="3.2" fill="#27ae60"/>
    <circle cx="666" cy="167" r="3.2" fill="#27ae60"/>
    <line x1="686" y1="103" x2="764" y2="103" stroke="#aeb6bf" stroke-width="2"/>
    <line x1="686" y1="135" x2="764" y2="135" stroke="#aeb6bf" stroke-width="2"/>
    <line x1="686" y1="167" x2="764" y2="167" stroke="#aeb6bf" stroke-width="2"/>

    <text x="715" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Servidor (Domain Controller)</text>
    <text x="715" y="252" text-anchor="middle" font-size="14" fill="#b03a2e" font-weight="600">192.168.170.132 : 389</text>
    <text x="715" y="270" text-anchor="middle" font-size="11" fill="#616a6b">WIN-6LNRNRBKNRO · segsi_domain.local</text>
  </g>

  <!-- ===== SETAS LDAP ===== -->
  <line x1="232" y1="112" x2="628" y2="112" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#aR)"/>
  <text x="430" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#b03a2e">pedidos LDAP (bind / search)</text>

  <line x1="628" y1="152" x2="232" y2="152" stroke="#1f618d" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="430" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#1f618d">respostas LDAP (success / resultados)</text>

  <!-- aviso sem cifra -->
  <g>
    <rect x="356" y="120" width="148" height="26" rx="4" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.3"/>
    <!-- cadeado aberto desenhado -->
    <path d="M369 132 v-3 a4 4 0 0 1 8 0" fill="none" stroke="#7d6608" stroke-width="1.6"/>
    <rect x="366" y="132" width="10" height="9" rx="1.5" fill="#7d6608"/>
    <text x="440" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#7d6608">TCP/389 sem cifra</text>
  </g>
</svg>
